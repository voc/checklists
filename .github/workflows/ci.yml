on:
  push:


concurrency: 
  group: ci
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive texlive-latex-extra

      - name: Build PDFs
        run: |
          mkdir -p build/
          mkdir -p pdf/

          for file in source/*; do
            echo "Building $file from source"
            xelatex -output-dir=build "$file"
            xelatex -output-dir=build "$file"
            xelatex -output-dir=build "$file"
          done

          mv -v build/*.pdf pdf/

      - name: Upload PDFs
        uses: actions/upload-artifact@v6
        with:
          name: pdfs
          path: pdf/
