name: CI
on:
  push:

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  build:
    name: Build checklists
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/voc/checklists:latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apt update
          apt install -y inkscape python3-tinycss2 imagemagick

      - name: Build PDFs
        run: |
          set -euo pipefail
          mkdir -p build/
          mkdir -p pdf/
          BUILD_FAILED=0

          for file in source/*.tex; do
            echo "Building $file from source"
            # run xelatex up to 3 times to resolve refs; stop early on success
            xelatex -output-dir=build "$file" || true
            xelatex -output-dir=build "$file" || true
            xelatex -output-dir=build "$file" || true
            # check whether PDF was produced
            base=$(basename "$file" .tex)
            if [ ! -f "build/${base}.pdf" ]; then
              echo "Build failed for $file"
              BUILD_FAILED=1
            fi
          done

          for file in svg/*.svg; do
            base=$(basename "$file" .svg)
            inkscape --export-area-page --export-filename "svg/${base}.png" --export-background="#ffffff" --export-background-opacity=1 "$file"
            inkscape --export-area-page --export-filename "svg/${base}.pdf" "$file"
            magick "svg/${base}.png" "svg/${base}.jpg"
          done

          # If any build failed, show logs and exit nonzero
          if [ "$BUILD_FAILED" -ne 0 ]; then
            echo "One or more builds failed — dumping build logs:"
            find build -name "*.log" -print -exec sed -n '1,200p' {} \; || true
            # preserve build dir as artifact in the next step by failing with nonzero
            exit 1
          fi

          mv -v build/*.pdf pdf/

      - name: Upload PDFs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pdfs
          path: pdf/

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-debug
          path: build/

      - name: Copy static files to pdf/ for GitHub Pages
        run: |
          mkdir -p _pages/pdf/
          mkdir -p _pages/svg/
          cp pdf/*.pdf _pages/pdf/
          cp svg/* _pages/svg/

          # create a simple index.html to link to the PDFs
          echo "<!DOCTYPE html><html><head><meta charset='utf-8'><title>Checklists</title></head><body><h5>Commit ${{ github.sha }}</h5><h1>Checklists</h1><ul>" > _pages/index.html
          # some css for fonts etc
          echo "<style>body { font-family: sans-serif; }</style>" >> _pages/index.html
          for pdf in pdf/*.pdf; do
            base=$(basename "$pdf")
            echo "<li><a href='pdf/$base'>$base</a></li>" >> _pages/index.html
          done
          echo "</ul><h2>SVGs</h2><ul>" >> _pages/index.html
          for svg in svg/*; do
            base=$(basename "$svg")
            echo "<li><a href='svg/$base'>$base</a></li>" >> _pages/index.html
          done
          echo "</ul></body></html>" >> _pages/index.html

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5 # or specific "vX.X.X" version tag for this action
        with:
          path: _pages/

  # Deployment job
  deploy:
    name: Deploy to webpage
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
